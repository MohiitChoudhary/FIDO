<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIDO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

    <!-- Particle js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/modernizr/2.8.3/modernizr.min.js"
        type="text/javascript"></script>

    <!--Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Siri WAve -->
     <script src="https://unpkg.com/siriwave/dist/siriwave.umd.min.js"></script>


    <!-- textllate js -->
    <link rel="stylesheet" href="assests/vendore/texllate/animate.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>
  
    <div class="container">
        <div class="bg-animation"></div>
    

    <section id="oval" class="mb-4" >

        <div class="row">
            <div class="col-md-1"></div>
            <div class="col-md-10">
                <div class="d-flex justify-content-center align-items-center  " style="height:80vh;">

                    <canvas id="canvasOne" width="700" height="420" style="position: absolute;"></canvas>

                  <div class="ai-core" id="aiCore">
    <div class="hologram-ring ring-1"></div>
    <div class="hologram-ring ring-2"></div>
    <div class="hologram-ring ring-3"></div>
    
    <div class="central-orb"></div>
    
    <div class="energy-particles" id="energyParticles"></div>
    
    <div class="dna-helix">
        <div class="helix-strand strand-1"></div>
        <div class="helix-strand strand-2"></div>
    </div>
    
    <div class="neural-network" id="neuralNetwork"></div>
    
    <div class="spectral-analyzer">
        <div class="spectral-bar" style="animation-delay: 0s; height: 30px;"></div>
        <div class="spectral-bar" style="animation-delay: 0.1s; height: 50px;"></div>
        <div class="spectral-bar" style="animation-delay: 0.2s; height: 40px;"></div>
        <div class="spectral-bar" style="animation-delay: 0.3s; height: 60px;"></div>
        <div class="spectral-bar" style="animation-delay: 0.4s; height: 35px;"></div>
        <div class="spectral-bar" style="animation-delay: 0.5s; height: 45px;"></div>
        <div class="spectral-bar" style="animation-delay: 0.6s; height: 55px;"></div>
        <div class="spectral-bar" style="animation-delay: 0.7s; height: 40px;"></div>
    </div>
</div>

                </div>
                <h5 class="text-light text text-center">How can I assist you today?</h5>
                <div class="col-md-12 mt-4 pt-4">
                    <div class="text-center" >
                        <div id="Textinput" class="d-flex">
                            <input type="text" class="input-field" name="chatbox" id="chatbox" placeholder="Type your message…">
                            
                            <button id="SendBtn" class="glow-on-hover"><i class="bi bi-send"></i>
                            </button>
                            <button id="MicBtn" class="glow-on-hover"><i class="bi bi-mic"></i>
                            </button>
                            <button id="ChatBtn" class="glow-on-hover" data-bs-toggle="offcanvas"
                                    data-bs-target="#offcanvasScrolling" aria-controls="offcanvasScrolling"><i class="bi bi-chat"></i>
                            </button>
                            <button id="SettingBtn" class="glow-on-hover"><i class="bi bi-gear"></i>
                            </button>

                        </div>
                    </div>
                </div>

            </div>
            <div class="col-md-1"></div>

        </div>

    </section>

    <section id="SiriWave" class="mb-4" hidden>

        <div class="container">
            <div class="row">
                <div class="col-md-12">
                    <div class="d-flex justify-content-center align-items-center " style="height: 100vh;">
                        <div class="">
                        <p class="text-start text-light mb-4 siri-message"> Hello , I'm FIDO! How  Can I Help You sir?
                        </p>
                        <div id="siri-container"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>


    </div>
            <div class="offcanvas offcanvas-start chat-canvas" data-bs-scroll="true" data-bs-backdrop="false" tabindex="-1"
        id="offcanvasScrolling" aria-labelledby="offcanvasScrollingLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title text-white" id="offcanvasScrollingLabel">Chats</h5>
            <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div id="chat-canvas-body" class="offcanvas-body">
            <!-- Chatting code here -->

        </div>
    </div>

    <!--Jquery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>

    <!-- Particle js -->
    <script src="script.js"></script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>

    <!-- Particle js -->
    <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
    <script src='https://ajax.googleapis.com/ajax/libs/jqueryui/1.11.2/jquery-ui.min.js'></script>

    <!-- texllate js -->
    <script src="assests/vendore/texllate/jquery.lettering.js"></script>
    <script src="assests/vendore/texllate/jquery.fittext.js"></script>
    <script src="http://jschr.github.io/textillate/jquery.textillate.js"></script>

    <script src="main.js"></script>
    <script src="/eel.js"></script>
    <script src="controller.js"></script>

</body>

</html>
